# GTA V ALLIN1 Configuration
# Copy this file to config.toml and adjust to your liking.

[general]
# Path to your GTA V installation. Set to "auto" to detect automatically.
gta_path = "auto"

# When true, all vehicles are free (no in-game cost).
# When false, vehicles use prices from prices.toml (editable).
free_mode = false

# Create backups of original game files before modifying.
backup = true

[traffic]
# Add GTA Online vehicles to ambient traffic so they appear naturally.
enabled = true

# Only spawn super/sports cars in wealthy neighborhoods (Vinewood, etc.)
rich_areas_only_supers = true

[vehicles]
# Enable all GTA Online vehicles. Set to false to use the catalog
# to pick specific vehicles.
enable_all = true

# Vehicle classes to exclude entirely.
# Options: compacts, coupes, sedans, suvs, muscle, sports, sportsclassics,
#          super, offroad, motorcycles, military, industrial, vans, boats,
#          helicopters, planes, openwheel, emergency, service
disabled_classes = []

# Specific vehicle model names to exclude.
disabled_vehicles = []

[script]
# Write debug info to scripts/ALLIN1.log (useful for troubleshooting).
enable_logging = false

# Replace vanilla police cars with DLC police vehicles.
enable_dlc_police = false

# Key to open the GBAY vehicle shop menu (default: F9).
# Uses .NET Keys enum names: F1-F12, NumPad0-9, etc.
gbay_key = "F9"

# When true, all GBAY purchases are free regardless of prices.
gbay_free_mode = false

# Max vehicles per safehouse garage (default: 4).
garage_capacity = 4

# Show debug markers at garage parking slots (for coordinate tuning).
garage_debug = false
