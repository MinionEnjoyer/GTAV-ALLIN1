name: Feature request
description: Suggest a focused improvement that fits ALLIN1's Story Mode launcher scope.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user workflow or limitation, not only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Safety and compatibility considerations
      description: Note affected editions, dependencies, package ownership, rollback, or data-preservation concerns.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request is for GTA V Story Mode and does not require redistributing proprietary game assets.
          required: true

