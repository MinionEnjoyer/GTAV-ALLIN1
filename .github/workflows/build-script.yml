name: Build ALLIN1.dll

on:
  push:
    paths:
      - 'script/**'
      - '.github/workflows/build-script.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore script/ALLIN1.csproj

      - name: Build Release
        run: dotnet build script/ALLIN1.csproj -c Release --no-restore

      - name: Find built DLL
        id: find-dll
        run: |
          $dll = Get-ChildItem -Path script -Recurse -Filter "ALLIN1.dll" | Select-Object -First 1
          if ($null -eq $dll) {
            Write-Error "ALLIN1.dll not found after build"
            Get-ChildItem -Path script/bin -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Found DLL at: $($dll.FullName)"
          echo "DLL_PATH=$($dll.FullName)" >> $env:GITHUB_OUTPUT

      - name: Copy binary to dist
        run: |
          New-Item -ItemType Directory -Path "script/dist" -Force | Out-Null
          Copy-Item -Path "${{ steps.find-dll.outputs.DLL_PATH }}" -Destination "script/dist/ALLIN1.dll" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALLIN1-dll
          path: script/dist/ALLIN1.dll

      - name: Commit pre-built binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add script/dist/ALLIN1.dll
          git diff --cached --quiet || git commit -m "Auto-build: update ALLIN1.dll"
          git push
