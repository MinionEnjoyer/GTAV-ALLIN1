name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest --cov=allin1 --cov-report=term-missing

  script-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore script/ALLIN1.csproj
      - run: dotnet build script/ALLIN1.csproj -c Release --no-restore

  asi-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S asi -B asi/build -A x64
      - run: cmake --build asi/build --config Release
