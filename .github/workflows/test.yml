name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer reviewed source revision supersedes the previous validation run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launcher-react:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Run source-bound React and service migration harness
        # Includes source-owned documentation and protocol regression checks.
        run: python tools/react_release_harness.py --product launcher
        env:
          ALLIN1_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Check documentation against current source
        run: python tools/documentation_audit.py
      - name: Retain migration evidence (not release qualification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-react-migration-evidence
          path: build/react-harness/
          if-no-files-found: error
      - run: pnpm build
        working-directory: desktop
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest --cov=allin1 --cov-report=term-missing

  script-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore script/tests/ALLIN1.Tests.csproj
      - run: dotnet test script/tests/ALLIN1.Tests.csproj -c Release --no-restore
      - run: dotnet restore script/reactor-bridge/ALLIN1.ReactorBridge.csproj
      - run: dotnet build script/reactor-bridge/ALLIN1.ReactorBridge.csproj -c Release --no-restore

  windows-real-toolchain:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python -m pip install -e ".[test]"
      - name: Checkout pinned SDK preview build dependency
        uses: actions/checkout@v4
        with:
          repository: MinionEnjoyer/ALLIN1-SDK
          ref: 118188ace769d85750fc7be5839770bdafe949ad
          path: build/preview-sdk
          persist-credentials: false
      - name: Freeze the offline preview worker
        run: |
          python -m pip install ./build/preview-sdk pyinstaller
          python tools/build_weapon_preview_worker.py --sdk build/preview-sdk
          python -m pytest tests/test_weapon_preview_assembly.py -v
      - name: Restore real toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            tools/gtautil
            tools/YTDToolio.exe
            tools/FuckDX.dll
          key: windows-real-tools-v2-${{ hashFiles('runtools.ps1', '.gitmodules', 'tools/RpfPatcher/**') }}
      - name: Build real preview and RPF tools
        shell: powershell
        timeout-minutes: 20
        run: ./runtools.ps1
      - name: Exercise real YTD and RPF packaging
        shell: powershell
        timeout-minutes: 8
        env:
          ALLIN1_RUN_TOOL_INTEGRATION: "1"
        run: python -m pytest tests/test_windows_toolchain_integration.py tests/test_stock_weapon_previews.py -m windows_integration -v
      - name: Rebuild packaged client binaries
        shell: powershell
        run: |
          dotnet restore script/tests/ALLIN1.Tests.csproj
          dotnet test script/tests/ALLIN1.Tests.csproj -c Release --no-restore
          dotnet restore script/reactor-bridge/ALLIN1.ReactorBridge.csproj
          dotnet build script/reactor-bridge/ALLIN1.ReactorBridge.csproj -c Release --no-restore
          Get-Item script/dist/ALLIN1.dll, script/dist/ALLIN1.ReactorBridge.plugin, script/dist/ALLIN1.ReactorBridge.contract.json | Out-Null
      - name: Build and verify public release contract
        shell: powershell
        run: |
          python -m allin1.cli build-release --output output/GTAV-ALLIN1-windows.zip
          python -m allin1.cli verify-release output/GTAV-ALLIN1-windows.zip
      - name: Upload integrity-checked package (not release-qualified)
        # Package integrity is separate from automated and live acceptance.
        # Artifact storage is a convenience and may be quota-limited.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GTAV-ALLIN1-windows
          path: output/GTAV-ALLIN1-windows.zip
          if-no-files-found: error
