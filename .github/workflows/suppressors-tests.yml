name: Independent Suppressors Enhanced checks

on:
  push:
    paths:
      - 'mods/realistic-suppressors/**'
      - '.github/workflows/suppressors-tests.yml'
  pull_request:
    paths:
      - 'mods/realistic-suppressors/**'
      - '.github/workflows/suppressors-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suppressors:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -e ".[test]"
      # Check existing distribution bytes before a build could replace them.
      - name: Check independent mod archives and package lifecycle
        run: python -m pytest mods/realistic-suppressors/tests/test_package_contract.py
      - name: Check independent mod policies
        if: success() || failure()
        run: dotnet test mods/realistic-suppressors/tests/RealisticSuppressors.Tests.csproj -c Release
