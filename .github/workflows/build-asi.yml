name: Build ALLIN1

on:
  push:
    paths:
      - 'script/**'
      - '.github/workflows/build-asi.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-allin1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-script:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore NuGet packages
        run: |
          dotnet restore script/ALLIN1.csproj -v normal
          dotnet restore script/reactor-bridge/ALLIN1.ReactorBridge.csproj -v normal

      - name: Build Release
        run: |
          dotnet build script/ALLIN1.csproj -c Release -o script/out --no-restore -v normal
          dotnet build script/reactor-bridge/ALLIN1.ReactorBridge.csproj -c Release --no-restore -v normal

      - name: List output
        run: Get-ChildItem -Path script/out -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: Verify staged runtime pair
        run: |
          # The bridge build stages ALLIN1.dll, the bridge, and their hash
          # contract as one compatible set. Never overwrite either binary
          # independently after that target runs.
          Get-Item "script/dist/ALLIN1.dll", "script/dist/ALLIN1.ReactorBridge.plugin", "script/dist/ALLIN1.ReactorBridge.contract.json" | Out-Null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALLIN1-runtime-${{ github.sha }}
          path: |
            script/dist/ALLIN1.dll
            script/dist/ALLIN1.ReactorBridge.plugin
            script/dist/ALLIN1.ReactorBridge.contract.json
          if-no-files-found: error
          retention-days: 14
