name: Build ALLIN1

on:
  push:
    paths:
      - 'asi/src/**'
      - 'asi/lib/**'
      - 'asi/CMakeLists.txt'
      - 'script/**'
      - '.github/workflows/build-asi.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-asi:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B asi/build -S asi -A x64

      - name: Build Release
        run: cmake --build asi/build --config Release

      - name: Copy binary to dist
        run: |
          New-Item -ItemType Directory -Path "asi/dist" -Force | Out-Null
          Copy-Item -Path "asi/build/bin/Release/ALLIN1.asi" -Destination "asi/dist/ALLIN1.asi" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALLIN1-asi
          path: asi/dist/ALLIN1.asi

      - name: Commit pre-built binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add asi/dist/ALLIN1.asi
          git diff --cached --quiet || git commit -m "Auto-build: update ALLIN1.asi"
          git push

  build-script:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        run: dotnet build script/ALLIN1.csproj -c Release -o script/out

      - name: List output
        run: Get-ChildItem -Path script/out -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: Copy binary to dist
        run: |
          New-Item -ItemType Directory -Path "script/dist" -Force | Out-Null
          Copy-Item -Path "script/out/ALLIN1.dll" -Destination "script/dist/ALLIN1.dll" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALLIN1-dll
          path: script/dist/ALLIN1.dll

      - name: Commit pre-built binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add script/dist/ALLIN1.dll
          git diff --cached --quiet || git commit -m "Auto-build: update ALLIN1.dll"
          git push
