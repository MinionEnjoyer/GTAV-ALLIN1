[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-v-allin1"
version = "0.3.0"
description = "Unlock all GTA Online vehicles in GTA V single player"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "click>=8.0",
    "lxml>=4.9",
    "Pillow>=10.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
allin1 = "allin1.cli:main"

[project.gui-scripts]
allin1-gui = "allin1.gui:main"

[tool.setuptools.package-data]
allin1 = ["assets/*.png", "assets/*.ico"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "windows_integration: requires Windows and the real preview packaging tools",
]

[tool.coverage.run]
source = ["allin1"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 91
omit = [
    "src/allin1/gui.py",
    "src/allin1/customization_ui.py",
]

[tool.setuptools.packages.find]
where = ["src"]
