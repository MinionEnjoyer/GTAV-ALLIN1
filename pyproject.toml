[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-v-allin1"
version = "0.6.7"
description = "GTA V Story Mode launcher, mod manager, and package lifecycle tooling"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "click>=8.0",
    "lxml>=4.9",
    "Pillow>=10.0",
    "numpy>=1.26",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
allin1 = "allin1.cli:main"

[project.gui-scripts]
allin1-gui = "allin1.desktop_entry:main"

[tool.setuptools.package-data]
allin1 = ["assets/*.png", "assets/*.ico"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "game_fixtures: requires local, non-distributed game capture fixtures",
    "windows_integration: requires Windows and the real preview packaging tools",
    "packaged_integration: requires explicitly supplied packaged release/archive artifacts",
]

[tool.coverage.run]
source = ["allin1"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 91
precision = 2

[tool.setuptools.packages.find]
where = ["src"]
