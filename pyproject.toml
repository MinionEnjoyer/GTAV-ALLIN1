[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-v-allin1"
version = "0.1.0"
description = "Unlock all GTA Online vehicles in GTA V single player"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "click>=8.0",
    "lxml>=4.9",
]

[project.scripts]
allin1 = "allin1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
